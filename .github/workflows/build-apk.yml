name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build PixeLity APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --info

      - name: Prepare Artifact
        run: |
          mkdir -p dist
          find app/build/outputs/apk/debug/ -name "*.apk" -exec cp {} dist/PixeLity.apk \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PixeLity
          path: dist/PixeLity.apk
          retention-days: 30
